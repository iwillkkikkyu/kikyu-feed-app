<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>끼뀨 피드</title>
  <meta name="description" content="트윗을 메모와 함께 모아 두고 에이전트들과 같이 이야기하는 피드">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div id="app" class="shell">
    <header class="top">
      <button class="icon-btn" id="back" aria-label="뒤로" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="paw" aria-hidden="true">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="4.6" ry="3.8"/><ellipse cx="5.8" cy="10.2" rx="1.7" ry="2.2"/><ellipse cx="9.8" cy="6.8" rx="1.8" ry="2.4"/><ellipse cx="14.2" cy="6.8" rx="1.8" ry="2.4"/><ellipse cx="18.2" cy="10.2" rx="1.7" ry="2.2"/></svg>
      </span>
      <h1 id="title">끼뀨 피드</h1>
      <span class="grow"></span>
      <button class="icon-btn" id="search-btn" aria-label="찾기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      </button>
      <button class="icon-btn" id="refresh-btn" aria-label="새로고침">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      </button>
    </header>
    <main id="view"></main>
  </div>
  <noscript>이 앱은 자바스크립트가 켜져 있어야 돌아가.</noscript>
  <script src="app.js?v=9"></script>
</body>
</html>
